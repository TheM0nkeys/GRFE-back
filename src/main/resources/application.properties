spring.application.name=grfe

spring.datasource.url=jdbc:postgresql://localhost:5432/grfe
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=5
spring.flyway.baseline-description=Schema inicial GRFE

servicenow.url=https://dev433125.service-now.com
servicenow.username=${SERVICENOW_USERNAME:}
servicenow.password=${SERVICENOW_PASSWORD:}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}